<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JVA's internal tracker for tenders, grants, projects and company applications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JVA Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JVA Project Tracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Push service worker (web/firebase-messaging-sw.js), registered in the
    scope the Firebase Messaging SDK itself uses
    ("/firebase-cloud-messaging-push-scope"), so it never competes with
    Flutter's own service worker at "/". Older versions of this page
    registered it at "/", which made the two keep replacing each other —
    those stray registrations are removed here.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          var w = reg.active || reg.waiting || reg.installing;
          var isMessagingSw = w && /firebase-messaging-sw\.js$/.test(w.scriptURL);
          var isPushScope = /firebase-cloud-messaging-push-scope/.test(reg.scope);
          if (isMessagingSw && !isPushScope) reg.unregister();
        });
      }).catch(function () {});
      navigator.serviceWorker
        .register('firebase-messaging-sw.js', { scope: 'firebase-cloud-messaging-push-scope' })
        .catch(function () {});
    }
  </script>
</body>
</html>
